# Alternative reverse proxy (nginx) for the API + dashboard, if you prefer nginx
# over Caddy. Terminate TLS here (certbot/Let's Encrypt) and proxy to the API.
# Note the WebSocket upgrade headers for /api/ws/live.

upstream tracking_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;
    # Redirect to HTTPS in production (after certs are installed).
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://tracking_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket live feed.
    location /api/ws/ {
        proxy_pass http://tracking_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }
}

